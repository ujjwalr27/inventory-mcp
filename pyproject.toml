[project]
name = "zoho-inventory-mcp"
version = "0.1.0"
description = "Read-only MCP connector that lets an Agent Studio agent look up items, sales orders and contacts in Zoho Inventory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",  # 2.x: FastMCP was renamed MCPServer
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[project.scripts]
zoho-mcp = "zoho_inventory_mcp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoho_inventory_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
